# Shared menu layout. Rows must be between 1 and 6.
# Every item can use: slot, material, amount, name, lore, glow and enabled.
layout:
  village: { rows: 4, back-slot: 4 }
  bank: { rows: 4, back-slot: 4 }
  store: { rows: 4, back-slot: 4 }
  resident: { rows: 4, back-slot: 4 }
  remove: { rows: 3, back-slot: 4 }
  upgrade: { rows: 4, back-slot: 4 }
  settings: { rows: 4, back-slot: 4 }
  effects: { rows: 4, back-slot: 4 }
  quests: { rows: 4, back-slot: 4 }
  logs: { rows: 4, back-slot: 4 }
  diplomacy: { rows: 4, back-slot: 4 }
  development: { rows: 4, back-slot: 4 }
  specializations: { rows: 3, back-slot: 4 }
  tutorial: { rows: 3, back-slot: 4 }
  delete-member: { rows: 3, back-slot: 4 }
  member-settings: { rows: 3, back-slot: 8 }

guis:
  #
  # SHARED GUI ELEMENTS
  #
  common:
    blank-white: { material: WHITE_STAINED_GLASS_PANE, name: "&7&kBlank" }
    blank-gray: { material: GRAY_STAINED_GLASS_PANE, name: "&7&kBlank" }
    blank-black: { material: BLACK_STAINED_GLASS_PANE, name: "&7&kBlank" }
    back: { material: ARROW, name: "&9Back" }
    next-page: { material: SPECTRAL_ARROW, name: "&9Next" }
    previous-page: { material: SPECTRAL_ARROW, name: "&cPrevious" }
    exit: { material: ARROW, name: "&cExit" }
    player-online: "&aThe player is online"

  crafting:
    title: "Crafting"
    recipe-title: "Crafting recipe"
    editor-title: "&8Edit recipe: %recipe%"
    result-arrow: "&e→"

  tutorial:
    welcome:
      title: "&aThanks for using &f&lADVANCED&6&lVILLAGES"
      subtitle: "&7Personalize your experience"
    titles:
      main: "&6Main settings"
      addons: "&6Addons"
      features: "&6Village features"
    status:
      enabled: "&aEnabled"
      disabled: "&cDisabled"
      value: "&f%value%"
      unsaved: "&eYou have unsaved changes."
      unchanged: "&7No settings were changed."
    editor:
      title: "&8Edit %setting%"
      valid:
        - "&aClick to save"
        - "&7Type: &f%type%"
      invalid:
        - "&cInvalid value"
        - "&7Expected: &f%type%"
    options:
      title: "&8Choose %setting%"
      name: "&f%value%"
      selected:
        - "&aSelected"
      available:
        - "&eClick to select"
      unavailable:
        - "&cRequired plugin is unavailable"
    categories:
      main:
        slot: 10
        material: COMPARATOR
        name: "&eMain settings"
        lore:
          - "&7Configure the basic plugin behavior."
      addons:
        slot: 12
        material: WRITABLE_BOOK
        name: "&6Addons"
        lore:
          - "&7Enable or disable optional modules."
      features:
        slot: 14
        material: EMERALD
        name: "&aVillage features"
        lore:
          - "&7Choose the mechanics available to villages."
    info:
      slot: 16
      material: KNOWLEDGE_BOOK
      name: "&bInformation"
      lore:
        - "&7Click to see additional information."
      lines:
        - "&8!&7------------------------------------&8!"
        - "&7This wizard configures the most important options."
        - "&7You can edit every setting later in the config files."
        - "&7Some changes require a complete server restart."
        - "&8!&7------------------------------------&8!"
    save:
      slot: 22
      material: LIME_DYE
      name: "&a&lSave and quit"
      lore:
        - "%changes%"
        - "&7The plugin will reload once."
    settings:
      language:
        slot: 10
        material: BOOK
        name: "&eLanguage"
        lore: ["&7Current: %value%", "&eClick to change."]
      timezone:
        slot: 12
        material: CLOCK
        name: "&eTime zone"
        lore: ["&7Current: %value%", "&eClick to change."]
      economy:
        slot: 14
        material: GOLD_NUGGET
        name: "&eEconomy"
        lore: ["&7Current: %value%", "&eClick to change."]
      worldedit:
        slot: 16
        material: WOODEN_AXE
        name: "&eWorldEdit schematics"
        lore: ["%status%", "&7Use schematics and the build editor.", "&eClick to change."]
      scoreboard:
        slot: 10
        material: OAK_SIGN
        name: "&eScoreboard"
        lore: ["%status%", "&eClick to change."]
      tablist:
        slot: 11
        material: PLAYER_HEAD
        name: "&eTablist"
        lore: ["%status%", "&eClick to change."]
      antilogout:
        slot: 12
        material: IRON_SWORD
        name: "&eAnti-logout"
        lore: ["%status%", "&eClick to change."]
      build-editor:
        slot: 13
        material: BRICKS
        name: "&eBuild editor"
        lore: ["%status%", "&eClick to change."]
      spawn:
        slot: 14
        material: COMPASS
        name: "&eSpawn"
        lore: ["%status%", "&eClick to change."]
      chat:
        slot: 15
        material: PAPER
        name: "&ePaper"
        lore: ["%status%", "&eClick to change."]
      animations:
        slot: 9
        material: BLAZE_POWDER
        name: "&eVillage animations"
        lore: ["%status%", "&eClick to change."]
      development:
        slot: 10
        material: EXPERIENCE_BOTTLE
        name: "&eDevelopment tree"
        lore: ["%status%", "&eClick to change."]
      logs:
        slot: 11
        material: BOOK
        name: "&eActivity logs"
        lore: ["%status%", "&eClick to change."]
      quests:
        slot: 12
        material: WRITABLE_BOOK
        name: "&eQuests"
        lore: ["%status%", "&eClick to change."]
      specializations:
        slot: 13
        material: KNOWLEDGE_BOOK
        name: "&eSpecializations"
        lore: ["%status%", "&eClick to change."]
      rent:
        slot: 14
        material: GOLD_INGOT
        name: "&eVillage upkeep"
        lore: ["%status%", "&eClick to change."]
      diplomacy:
        slot: 15
        material: PAPER
        name: "&eDiplomacy"
        lore: ["%status%", "&eClick to change."]
      ranking:
        slot: 16
        material: NETHER_STAR
        name: "&eRanking"
        lore: ["%status%", "&eClick to change."]

  tag:
    title: "Name your village"
    input-name: "*NAME*"
    output-prompt: "Name your village"

  village:
    #
    # SETTINGS
    #
    settings:
      slot: 4
      material: NOTE_BLOCK
      name: "&lSettings"
      lore:
        - "&7Manage Village"
      teleport:
        slot: 19
        material: FEATHER
        name: "&b&lTeleport"
        lore:
          - "&8—————————————"
          - " "
          - "%village_teleport%"
          - "&7Click to set"
          - "&8—————————————"
      tag:
        slot: 21
        material: MOJANG_BANNER_PATTERN
        name: "&c&lTag"
        lore:
          - "&8—————————————"
          - " "
          - "&e&lTag: &c%village_tag%"
          - "%istagset%"
          - "&8—————————————"
        # %istagset% >>>
        tag_set: " "
        tag_not_set: "&7Click to set"
        # %istagset% ^^^
      pvp:
        slot: 25
        material: NETHERITE_SWORD
        name: "&f&lPVP"
        lore:
          - "&8—————————————"
          - " "
          - "&7Pvp: %village_pvp%"
          - " "
          - "&8—————————————"
      tnt:
        slot: 23
        material: TNT
        name: "&c&lTNT"
        lore:
          - "&8—————————————"
          - " "
          - "&7TNT: %village_tnt%"
          - " "
          - "&8—————————————"
      animations:
        slot: 13
        material: REDSTONE
        name: "&d&lAnimations"
        lore:
          - "&8—————————————"
          - " "
          - "&7Animations: %village_animations%"
          - " "
          - "&8—————————————"
      logs:
        slot: 27
        material: BOOK
        name: "&6Activity logs"
        lore:
          - "&7View important changes and actions"
          - "&7in the village."
      delete:
        slot: 31
        material: RED_BED
        name: "&4&l&nDelete village"
        lore:
          - "&8—————————————"
          - " "
          - "&7Click to delete"
          - " "
          - "&8—————————————"
    diplomacy:
      slot: 29
      material: IRON_SWORD
      name: "&bDiplomacy"
      lore:
        - "&7Alliances and wars"
    development:
      slot: 33
      material: BLAZE_POWDER
      name: "&dDevelopment tree"
      lore:
        - "&7Choose permanent village bonuses"
    specializations:
      slot: 29
      material: KNOWLEDGE_BOOK
      name: "&aSpecializations"
      lore:
        - "&7Choose your personal village bonus"
    #
    # STORE
    #
    store:
      slot: 21
      material: NETHER_STAR
      name: "&3Store"
      lore:
        - "&7Village store"
      hearth:
        slot: 19
        price: 240
        lore:
          - "&7Buy for &6%price%$"
      destroyer:
        slot: 21
        price: 120
        lore:
          - "&7Buy for &6%price%$"
    #
    # MEMBERS
    #
    members:
      slot: 11
      material: PLAYER_HEAD
      start-slot: 9
      compact-start-slot: 19
      name: "&cMembers"
      lore:
        - "&7Manage members"
      owner:
        enabled: true
        name: "&6%PLAYER% &cOWNER"
        lore:
          - "&7Role: %role%"
          - "&7Specialization: %specialization%"
          - " "
          - "&7Last online: %PLAYER_LAST_ONLINE%"
          - " "
      resident:
        enabled: true
        name: "%PLAYER%"
        lore:
          - "&7Role: %role%"
          - "&7Specialization: %specialization%"
          - " "
          - "&7Last online: %PLAYER_LAST_ONLINE%"
          - " "
    #
    # EFFECTS
    #
    effects:
      slot: 23
      material: SPLASH_POTION
      name: "&dEffects"
      lore:
        - "&7Add effects for"
        - "&7Members of village"
      regeneration:
        slot: 19
        material: FEATHER
        name: "&cRegeneration"
        lore:
          - "&7Gives &cRegeneration &7effect"
          - "&7Amplifier: &6%amplifier%"
      speed:
        slot: 21
        material: RABBIT_FOOT
        name: "&bSpeed"
        lore:
          - "&7Gives &bSpeed &7effect"
          - "&7Amplifier: &6%amplifier%"
      jump:
        slot: 23
        material: SLIME_BALL
        name: "&aJump boost"
        lore:
          - "&7Gives &aJump boost &7effect"
          - "&7Amplifier: &6%amplifier%"
      haste:
        slot: 25
        material: GOLDEN_PICKAXE
        name: "&eHaste"
        lore:
          - "&7Gives &eHaste &7effect"
          - "&7Amplifier: &6%amplifier%"
      price_paper:
        name: "&eClick to buy"
        lore:
          - "&7Gives &e%effect% &7effect"
          - "&7Price: &6%price%"
      purchase-regeneration:
        slot: 28
        material: PAPER
      purchase-speed:
        slot: 30
        material: PAPER
      purchase-jump:
        slot: 32
        material: PAPER
      purchase-haste:
        slot: 34
        material: PAPER
    #
    # UPGRADE
    #
    upgrade:
      slot: 31
      material: DIAMOND
      name: "&bUpgrade"
      lore:
        - "&7Upgrade village"
      upgrade-button:
        slot: 13
        name: "&aUpgrade village"
        lore:
          - "&7Actual level: &e%village_level%"
          - "&7Cost: &a%village_cost%"
          - "&cClick to &6Upgrade"
      info:
        material: PAPER
        name: "&cTo upgrade:"
        name-upgraded: "&bUpgraded"
        lore:
          - "&7Level &c%village_level% &f-> &e%village_next_level%"
          - "&7Size: &c%village_size% &7-> &e%village_next_size%"
          - "&eCost: &a%village_cost%"
      max-level:
        slot: 13
        material: BARRIER
        name: "&cMaximum level"
        lore:
          - "&7The village has reached the "
          - "&7highest level set in levels.yml."
    #
    # BANK
    #
    bank:
      slot: 15
      material: SUNFLOWER
      name: "&6Bank"
      lore:
        - "&7Village bank"
      account_balance:
        slot: 13
        material: PAPER
        name: "&6Bank&7: %village_balance%"
      upkeep:
        slot: 18
        material: CLOCK
        name: "&6Village upkeep"
        lore:
          - "&7Next cost: &6%cost%$"
          - "&7Payment in: &f%time%"
          - "&7Missed payments: &c%missed%"
      add:
        name: "&aAdd to bank"
      remove:
        name: "&cRemove from bank"
      deposit-all: { slot: 11, material: GREEN_DYE, amount: 1 }
      withdraw-all: { slot: 15, material: RED_DYE, amount: 1 }
      deposit-1: { slot: 20, material: EMERALD, amount: 1 }
      deposit-5: { slot: 21, material: EMERALD, amount: 5 }
      deposit-10: { slot: 22, material: EMERALD, amount: 10 }
      deposit-100: { slot: 23, material: EMERALD_BLOCK, amount: 1 }
      deposit-1000: { slot: 24, material: EMERALD_BLOCK, amount: 10 }
      withdraw-1: { slot: 29, material: REDSTONE, amount: 1 }
      withdraw-5: { slot: 30, material: REDSTONE, amount: 5 }
      withdraw-10: { slot: 31, material: REDSTONE, amount: 10 }
      withdraw-100: { slot: 32, material: REDSTONE_BLOCK, amount: 1 }
      withdraw-1000: { slot: 33, material: REDSTONE_BLOCK, amount: 10 }
    quests:
      slot: 13
      material: WRITABLE_BOOK
      name: "&eVillage quests"
      lore:
        - "&7Complete shared daily and weekly quests."
    exit:
      slot: 35
      material: ARROW
      name: "&cExit"

  #
  # ACTIVITY LOGS
  # Event descriptions and value names are configured in addons/logs.yml.
  #
  logs:
    start-slot: 9
    date-format: "dd.MM.yyyy HH:mm"
    no-permission:
      slot: 13
      material: BARRIER
      name: "&cYou do not have permission to view village logs."
    empty:
      slot: 13
      material: PAPER
      name: "&7There are no recorded activities yet."
    entry:
      system: "Village system"
      actor: "&7Performed by: &f%actor%"
      date: "&7Date: &f%date%"
      grouped: "&8Merged actions: &7%count%"
    types:
      village-created: { material: BEACON, name: "&aVillage created" }
      village-hearth-add: { material: REDSTONE, name: "&cVillage life restored" }
      member-join: { material: LIME_DYE, name: "&aMember joined" }
      member-leave: { material: ORANGE_DYE, name: "&eMember left" }
      member-kick: { material: RED_DYE, name: "&cMember removed" }
      member-permission: { material: NAME_TAG, name: "&bMember permission" }
      member-role: { material: NAME_TAG, name: "&eMember role" }
      bank-deposit: { material: GOLD_INGOT, name: "&aBank deposit" }
      bank-withdraw: { material: GOLD_NUGGET, name: "&cBank withdrawal" }
      quest-completed: { material: WRITABLE_BOOK, name: "&eQuest completed" }
      setting-changed: { material: COMPARATOR, name: "&dSetting changed" }
      village-upgrade: { material: DIAMOND, name: "&bVillage upgraded" }
      village-attack: { material: IRON_SWORD, name: "&cVillage attacked" }
      alliance-created: { material: EMERALD, name: "&aAlliance formed" }
      alliance-ended: { material: FIRE_CHARGE, name: "&eAlliance ended" }
      war-declared: { material: WRITABLE_BOOK, name: "&cWar declared" }
      war-started: { material: IRON_SWORD, name: "&4War started" }
      war-ended: { material: SHIELD, name: "&6War ended" }
      development-unlocked: { material: BLAZE_ROD, name: "&dDevelopment unlocked" }
      upkeep-paid: { material: GOLD_INGOT, name: "&aUpkeep paid" }
      upkeep-missed: { material: REDSTONE, name: "&cUpkeep missed" }
      upkeep-penalty: { material: WITHER_SKELETON_SKULL, name: "&4Upkeep penalty" }

  #
  # VILLAGE QUESTS
  # Quest mechanics, targets and rewards are configured in addons/quests.yml.
  #
  quests:
    start-slot: 9
    empty:
      slot: 13
      material: BARRIER
      name: "&cNo quests are currently configured."
    period:
      daily: "&eDaily quest"
      weekly: "&6Weekly quest"
    status:
      progress: "&7Progress: &e%progress%&7/&e%required%"
      completed: "&aCompleted! &7(%progress%/%required%)"
      active: "&aActive - progress is being collected"
      inactive: "&cInactive - progress is not being collected"
      activate: "&eClick to activate this quest for the village."
    reset: "&7Resets in: &f%time%"
    rewards:
      title: "&6Rewards:"
      bank: "&7 • Village bank: &6%amount%$"
      experience: "&7 • Every online member: &e%amount% XP"
      points: "&7 • Every member: &b%amount% points"
    progress-bar:
      length: 20
      prefix: "&8["
      completed: "&a|"
      remaining: "&7|"
      suffix: "&8]"
    tasks:
      monster-hunt:
        material: IRON_SWORD
        name: "&cMonster hunt"
        lore:
          - "&7Defeat hostile creatures together with your village."
      mining-shift:
        material: IRON_PICKAXE
        name: "&bMining shift"
        lore:
          - "&7Mine basic ores for the village."
      wood-supplies:
        material: OAK_LOG
        name: "&6Wood supplies"
        lore:
          - "&7Collect logs needed to expand the village."
      construction-shift:
        material: STONE_BRICKS
        name: "&6Construction shift"
        lore:
          - "&7Place building blocks for the village."
      workshop-orders:
        material: CRAFTING_TABLE
        name: "&eWorkshop orders"
        lore:
          - "&7Craft useful supplies for village members."
      village-angler:
        material: FISHING_ROD
        name: "&bVillage angler"
        lore:
          - "&7Catch fish for the village pantry."
      foundry-shift:
        material: FURNACE
        name: "&7Foundry shift"
        lore:
          - "&7Smelt basic metals in furnaces."
      village-treasury:
        material: SUNFLOWER
        name: "&eVillage treasury"
        lore:
          - "&7Deposit money into the village bank."
      great-hunt:
        material: DIAMOND_SWORD
        name: "&4Great hunt"
        lore:
          - "&7Defeat hostile creatures throughout the week."
      animal-care:
        material: WHEAT
        name: "&aAnimal care"
        lore:
          - "&7Breed farm animals throughout the week."
      master-enchanter:
        material: ENCHANTING_TABLE
        name: "&5Master enchanter"
        lore:
          - "&7Enchant equipment for the village."
      experience-drive:
        material: EXPERIENCE_BOTTLE
        name: "&dExperience drive"
        lore:
          - "&7Collect experience together as a village."

  #
  # DEVELOPMENT TREE
  # The mechanics and bonus values are configured in addons/development.yml.
  #
  development:
    empty:
      slot: 22
      material: BARRIER
      name: "&7No development nodes are configured."
    status:
      unlocked: "&aUnlocked"
      available: "&eClick to unlock"
      locked: "&cLocked"
    cost: "&7Cost: &6%cost%$"
    level: "&7Required village level: &f%level%"
    requires: "&7Requires: &f%nodes%"
    bonuses:
      title: "&dBonuses:"
      max-members: "&8 • &a+%value% &7member slots"
      quest-bank-percent: "&8 • &a+%value%% &7bank rewards from quests"
      war-score-percent: "&8 • &a+%value%% &7war score earned"
      attack-protection-percent: "&8 • &a+%value%% &7protection after an attack"
      teleport-delay-reduction-percent: "&8 • &a-%value%% &7village teleport delay"
      effect-cost-discount-percent: "&8 • &a-%value%% &7effect purchase prices"
    nodes:
      economy-1:
        slot: 11
        material: GOLD_INGOT
        name: "&6Trade routes I"
        lore:
          - "&7Increase income from shared village quests."
      economy-2:
        slot: 20
        material: EMERALD
        name: "&6Trade routes II"
        lore:
          - "&7Negotiate lower prices for village effects."
      economy-3:
        slot: 29
        material: EMERALD_BLOCK
        name: "&6Trade routes III"
        lore:
          - "&7Greatly increase income from village quests."
      community-1:
        slot: 13
        material: PLAYER_HEAD
        name: "&bGrowing community I"
        lore:
          - "&7Prepare the village for one additional member."
      community-2:
        slot: 22
        material: ENDER_PEARL
        name: "&bGrowing community II"
        lore:
          - "&7Shorten teleport preparation for all members."
      community-3:
        slot: 31
        material: TOTEM_OF_UNDYING
        name: "&bGrowing community III"
        lore:
          - "&7Open the village to two more members."
      defense-1:
        slot: 15
        material: SHIELD
        name: "&cFortifications I"
        lore:
          - "&7Extend village protection after losing a life."
      defense-2:
        slot: 24
        material: IRON_SWORD
        name: "&cFortifications II"
        lore:
          - "&7Earn more score for village actions during wars."
      defense-3:
        slot: 33
        material: NETHERITE_CHESTPLATE
        name: "&cFortifications III"
        lore:
          - "&7Greatly extend protection after an attack."

  diplomacy:
    start-slot: 9
    states:
      preparing: "&ePreparation"
      active: "&cActive"
      finished: "&7Cooldown"
    ally:
      material: EMERALD
      name: "&aAlliance: &f%village%"
      lore:
        - "&7This village is your ally."
    request-incoming:
      material: PAPER
      name: "&eAlliance request from %village%"
      lore:
        - "&7Expires in: &f%time%"
    request-outgoing:
      material: MAP
      name: "&6Alliance request to %village%"
      lore:
        - "&7Expires in: &f%time%"
    war:
      material: IRON_SWORD
      name: "&cWar: &f%village%"
      lore:
        - "&7Status: %state%"
