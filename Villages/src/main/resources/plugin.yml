main: pl.kiosel.villages.AdvancedVillages
version: '${project.version}'
name: AdvancedVillages
authors: [ Kiosel ]
api-version: 1.13
description: Rewrite for plugin Wioski
website: kiosel.pl

softdepend:
  - PlaceholderAPI
  - WorldEdit
  - WorldGuard
  - Vault
  - Reserve
  - PlayerPoints

commands:
  crafting:
    aliases:
      - villagecrafting

permissions:
  villages.admin.logs:
    description: Allows viewing village activity logs without village permissions
    default: op
  villages.command.edit:
    description: Allows editing global village building schematics
    default: op
  villages.command.quests:
    description: Allows opening village quests
    default: true
  advancedvillages.ranking.exempt:
    description: Excludes the player from public ranking tops
    default: false
