license: "PUT-YOUR-LICENSE-HERE"

enabled-worlds:
  - world

use-worldedit: false

village:
  ## set 0 to disable
  village-minimal-distance: 300
  spawn-minimal-distance: 1000
  max-members: 7 #real max is 27
  tag-max-length: 5
  default:
    cost: 1000
    size: 25
  upgrade:
    1:
      cost: 2000
      size: 50
    2:
      cost: 2500
      size: 75
    3:
      cost: 3000
      size: 100
    4:
      cost: 4000
      size: 125
  effects:
    regeneration:
      cost: 125
      amplifier: 1
    speed:
      cost: 225
      amplifier: 1
    jump-boost:
      cost: 350
      amplifier: 1
    haste:
      cost: 500
      amplifier: 2

teleport:
  #IN SECONDS
  cancel-on-move: true
  between-cooldown: 60
  cooldown: 5

chat:
  village-chat: "&8[&5&lVillage&8] &f%player_name%&7: &f%message%"
  enabled: true
  format: "&c%village_tag% &f%player_name%&7: &r%message%"

scoreboard:
  enabled: true
  title: "&6&lVillages"
  score:
    - "&7--------------"
    - "&7Nick: &e%player_name%"
    - "&7Money: &e%player_money%"
    - "&7 "
    - "&7Village:"
    - " &7Owner: &e%village_owner%"
    - " &7Life: &e%village_life%"
    - " &7Level: &e%village_level%"
    - " &7Tag: &e%village_tag%"
    - "&7--------&7------"
  animation:
    enabled: true
    speed: 10
    titles:
      - "&6&lVillages"
      - "&b&lVillages"
      - "&f&lWioski"
      - "&b&lV&f&li&b&ll&b&ll&f&la&b&lg&f&le&f&ls"

storage:
  # TYPES: MYSQL, SQL
  type: "MYSQL"
  table: "villages"
  # Saves villages / seconds
  save: 30
  mysql:
    ping-interval: 3600
    host: "localhost"
    port: 3306
    database: "villages"
    username: "admin"
    password: "admin"
