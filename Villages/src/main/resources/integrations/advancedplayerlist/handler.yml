# Each TEXT handler fills one 20-slot column. Ranking rows rotate together
# every 200 ticks, matching the pages from addons/tablist.yml.

avPlayerOverview:
  type: TEXT
  refreshTicks: 20
  ping: 0
  text:
    - ''
    - ' &c&lSTATISTICS'
    - ''
    - ' &7Nick: &b{villages_name}'
    - ''
    - ' &7Points: &b{villages_points}'
    - ' &7Kills: &b{villages_kills}'
    - ' &7Deaths: &b{villages_deaths}'
    - ' &7Assists: &b{villages_assists}'
    - ' &7KDR: &b{villages_kdr}'
    - ''
    - ' &b&lINFORMATION'
    - ''
    - ' &7Ping: &b{villages_ping}ms'
    - ' &7TPS: &b{villages_tps}'
    - ''
    - ' &7Online: &b{villages_online}'
    - ''
    - ' &7Time: &b{villages_hour}:{villages_minute}:{villages_second}'
    - ''

avVillageOverview:
  type: TEXT
  refreshTicks: 20
  ping: 0
  text:
    - ''
    - ' &c&lVILLAGE STATISTICS'
    - ''
    - ' &7Village: &b{villages_g-tag}'
    - ''
    - ' &7Points: &b{villages_g-avg-points}'
    - ' &7Kills: &b{villages_g-kills}'
    - ' &7Deaths: &b{villages_g-deaths}'
    - ' &7Assists: &b{villages_g-assists}'
    - ' &7KDR: &b{villages_g-kdr}'
    - ''
    - ' &7Lives: &b{villages_g-lives-symbol} &8(&b{villages_g-lives}&8)'
    - ''
    - ' &7Level: &b{villages_g-level}'
    - ' &7Members: &b{villages_g-members-online}&7/{villages_g-members-all}'
    - ' &7Allies: &a{villages_g-allies}'
    - ' &7Wars: &c{villages_g-wars}'
    - ''
    - ' &7Protection: &b{villages_g-protection-time}'
    - ''

