# Each TEXT handler fills one 20-slot column. Ranking rows rotate together
# every 200 ticks, matching the pages from addons/tablist.yml.

avPlayerOverview:
  type: TEXT
  refreshTicks: 20
  ping: 0
  text:
    - ''
    - ' &c&lSTATISTICS'
    - ''
    - ' &7Nick: &b{villages_player-name}'
    - ''
    - ' &7Points: &b{villages_player-points}'
    - ' &7Kills: &b{villages_player-kills}'
    - ' &7Deaths: &b{villages_player-deaths}'
    - ' &7Assists: &b{villages_player-assists}'
    - ' &7KDR: &b{villages_player-kdr}'
    - ''
    - ' &b&lINFORMATION'
    - ''
    - ' &7Ping: &b{villages_player-ping}ms'
    - ' &7TPS: &b{server_tps}'
    - ''
    - ' &7Online: &b{villages_server-online}'
    - ''
    - ' &7Time: &b{villages_time-hour}:{villages_time-minute}:{villages_time-second}'
    - ''

avVillageOverview:
  type: TEXT
  refreshTicks: 20
  ping: 0
  text:
    - ''
    - ' &c&lVILLAGE STATISTICS'
    - ''
    - ' &7Village: &b{villages_village-tag}'
    - ''
    - ' &7Points: &b{villages_village-avg-points}'
    - ' &7Kills: &b{villages_village-kills}'
    - ' &7Deaths: &b{villages_village-deaths}'
    - ' &7Assists: &b{villages_village-assists}'
    - ' &7KDR: &b{villages_village-kdr}'
    - ''
    - ' &7Lives: &b{villages_village-lives-symbol} &8(&b{villages_village-lives}&8)'
    - ''
    - ' &7Level: &b{villages_village-level}'
    - ' &7Members: &b{villages_village-members-online}&7/{villages_village-members-all}'
    - ' &7Allies: &a{villages_village-allies}'
    - ' &7Wars: &c{villages_village-wars}'
    - ''
    - ' &7Protection: &b{villages_village-protection-time}'
    - ''

