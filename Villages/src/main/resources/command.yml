# Root command names, aliases and permissions are applied on a full server restart.
# Values under command-language (and spawn.permission-set) are applied by plugin reload.
command:
  name: village
  aliases:
    - wioski
    - vil

spawn:
  name: spawn
  aliases:
    - tpspawn

crafting:
  name: crafting
  aliases:
    - villagecrafting

command-language:
  admin: admin
  admin_reload: reload
  admin_give: give
  admin_manage: manage
  admin_debug: debug
  admin_integration: integration

  admin_give_villageblock: village
  admin_give_destroyer: destroyer
