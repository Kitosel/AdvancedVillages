# Root command names, aliases and permissions are applied on a full server restart.
# Values under command-language (and spawn.permission-set) are applied by plugin reload.
command:
  name: village
  aliases:
    - wioski
    - vil
  permission: villages.command

spawn:
  name: spawn
  aliases:
    - tpspawn
  permission: villages.spawn
  permission-set: villages.spawn.set

command-language:
  admin: admin
  admin_reload: reload
  admin_give: give
  admin_give_villageblock: village
  admin_give_destroyer: destroyer
  admin_give_destroyer_hearth: destroyer-hearth
  admin_give_village_hearth: village-hearth
  admin_give_hearth_part: village-hearth-part
  admin_manage: manage
  admin_settings: settings

  admin_lives: lives
  admin_upgrade: upgrade
  admin_delete: delete
  admin_protection: protection
  admin_bank: bank

  admin_add: add
  admin_remove: remove

  chat: chat
  invite: invite
  leave: leave
  request: request
  request_accept: confirm
  request_deny: deny
  teleport: tp
  edit: edit
  edit_save: save
  edit_cancel: cancel
  help: help

  set: set
