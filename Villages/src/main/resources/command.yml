  admin_give_village_hearth: village-hearth
  admin_give_hearth_part: village-hearth-part

  admin_integration_tablist: tablist
  admin_integration_install: install
  admin_integration_restore: restore
  admin_integration_status: status

  admin_lives: lives
  admin_upgrade: upgrade
  admin_delete: delete
  admin_protection: protection
  admin_bank: bank

  admin_add: add
  admin_remove: remove

  chat: chat
  invite: invite
  leave: leave
  request: request
  request_accept: confirm
  request_deny: deny
  teleport: tp

  edit: edit
  edit_save: save
  edit_cancel: cancel

  alliance: alliance
