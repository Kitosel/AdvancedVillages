# Village alliances and wars. Changes are applied by the normal plugin reload.
enabled: true

alliances:
  enabled: true
  maximum-per-village: 3
  # Supported units: s, m, h, d, w, mo, y. Values may be combined, for example 1h30m.
  request-expiration: 10m
  prevent-friendly-fire: true
  prevent-village-attacks: true

wars:
  enabled: true
  # When enabled, a destroyer works against another village only during an active war.
  require-war-to-attack: true
  preparation-time: 10m
  duration: 24h
  cooldown: 12h
  maximum-per-village: 1
  minimum-members: 1
  minimum-online-members: 1
  declaration-cost: 0

  scoring:
    player-kill: 1
    village-life: 5

  rewards:
    winner-bank: 0
