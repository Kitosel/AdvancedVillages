# All player-facing messages are configured in the selected .lang file.

# Permission that allows bypassing the anti-logout system
combat-bypass: false
combat-bypass-permission: "advancedvillages.antylogout.bypass"

# Duration of combat (in seconds)
combat-duration: 20

# Whether combat ends when the opponent dies
remove-combat-on-opponent-death: true

# Whether to send notifications when combat starts
combat-start-notifications-enabled: true

# Whether combat can start from mob attacks
combat-from-mobs: true

# Whether combat can start from projectiles (e.g., arrows)
combat-from-projectiles: true

# Broadcast when opponent quit while combat
combat-quit-broadcast: true

# Whether commands are blocked during combat
commands-blocked-during-combat: true

# List of allowed commands during combat
combat-command-whitelist: ["msg", "r", "reply"]

# Knockback multiplier when trying to enter a blocked region
blocked-region-knockback-multiplier: 1

# List of regions players cannot enter during combat
blocked-regions: ["spawn"]
