# All built-in variables follow the simple format %NAME%.
# Examples: %PLAYER%, %POINTS%, %G-TAG%, %G-UPKEEP-COST%, %PTOP-POINTS-1%.
# The PlaceholderAPI also works and is executed after the AdvancedVillages variables.

# How many ticks should the data be refreshed every (20 ticks = 1 second)?
update-interval-ticks: 20

# A ping is displayed next to fake entries in the table.
cells-ping: 0

# true always create 80 fields; false ends tablist in last configured field
fill-cells: true
use-relationship-colors: false

# Header and footer can be single string or list
header:
  - " "
  - "&6Advanced&bVillages"
  - "&7Hi &6%player% "
  - " "
footer:
  - " "
  - "&aPlay with your friends! :D"
  - "&7WWW: &6domain.pl - &7&lMoney: &a%vault_eco_balance_fixed%"
  - " "

# The field numbers range from 1 to 80
cells:
  "2": " &c&lSTATISTIC"
  "4": " &7Nick: &b%PLAYER%"
  "6": " &7Points: &b%POINTS%"
  "7": " &7Kills: &b%KILLS%"
  "8": " &7Deaths: &b%DEATHS%"
  "9": " &7Asysty: &b%ASSISTS%"
  "10": " &7KDR: &b%KDR%"

  "12": " &b&lINFORMACJE"
