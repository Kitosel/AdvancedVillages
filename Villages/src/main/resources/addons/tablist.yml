# All built-in variables follow the simple format %name%.
# Examples: %player-name%, %player-points%, %village-tag%, %village-upkeep-cost%, %playertop-points-1%.
# The PlaceholderAPI also works and is executed after the AdvancedVillages variables.

# How many ticks should the data be refreshed every (20 ticks = 1 second)?
update-interval-ticks: 20

# A ping is displayed next to fake entries in the table.
cells-ping: 0

# true always create 80 fields; false ends tablist in last configured field
fill-cells: true
use-relationship-colors: false

# Header and footer can be single string or list
header:
  - " "
  - "&6Advanced&6Villages"
  - "&7Hi &6%player-name% "
  - " "
footer:
  - " "
  - "&aPlay with your friends! :D"
  - "&7WWW: &6domain.com - &7&lMoney: &a%vault_eco_balance_fixed%"
  - " "

# The field numbers range from 1 to 80
cells:
  "2": " &c&lSTATISTIC"
  "4": " &7Nick: &6%player-name%"
  "6": " &7Points: &6%player-points%"
  "7": " &7Kills: &6%player-kills%"
  "8": " &7deaths: &6%player-deaths%"
  "9": " &7Asysty: &6%player-assists%"
  "10": " &7KDR: &6%player-kdr%"

  "12": " &6&lINFORMATION"
  "14": " &7Ping: &6%player-ping%"
  "15": " &7TPS: &6%server-tps%"
  "17": " &7Online: &6%server-online%"
  "19": " &7Hour: &6%TIME-HOUR%:%TIME-MINUTE%:%TIME-SECOND%"

  "22": " &c&lVILLAGE STATISTIC"
  "24": " &7Village: &6%village-tag%"
  "26": " &7Points: &6%village-avg-points%"
  "27": " &7Kills: &6%village-kills%"
  "28": " &7deaths: &6%village-deaths%"
