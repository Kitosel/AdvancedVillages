# Shared menu layout. Rows must be between 1 and 6.
# Every item can use: slot, material, amount, name, lore, glow and enabled.
layout:
  #
  # VILLAGE GUI LAYOUT
  #
  # To lock a feature in the village until a certain level is reached, add “required-level”
  village: { rows: 5, back-slot: 4 }
  bank: { rows: 5, back-slot: 4, required-level: 2 }
  store: { rows: 4, back-slot: 4, required-level: 2 }
  resident: { rows: 5, back-slot: 4 }
  upgrade: { rows: 5, back-slot: 4 }
  settings: { rows: 5, back-slot: 4 }
  effects: { rows: 5, back-slot: 4, required-level: 3 }
  quests: { rows: 5, back-slot: 4, required-level: 2 }
  logs: { rows: 5, back-slot: 4 }
  diplomacy: { rows: 5, back-slot: 4 }
  development: { rows: 5, back-slot: 4, required-level: 2 }
  permission: { rows: 4, back-slot: 4 }
  upkeep: { rows: 5, back-slot: 4 }
  specializations: { rows: 4, back-slot: 4 }
  remove: { rows: 3, back-slot: 4 }
  delete-member: { rows: 3, back-slot: 4 }
  member-settings: { rows: 3, back-slot: 8 }

  # CRAFTING GUI
  crafting: { rows: 1, back-slot: 1 }
  crafting-recipe: { rows: 1, back-slot: 1 }
  crafting-editor: { rows: 1, back-slot: 1 }

  # TUTORIAL GUI
  tutorial: { rows: 3, back-slot: 4 }

